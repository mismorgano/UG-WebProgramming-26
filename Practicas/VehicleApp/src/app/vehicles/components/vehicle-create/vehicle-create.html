<form [formGroup]="carForm" (submit)="saveVehicle()">
  <label>Year</label>
  <input type="text" formControlName="year" />
  <label>Model</label>
  <input type="text" formControlName="model" />
  <label>Brand</label>
  <select formControlName="brandId" required>
    @for (brand of brands(); track brand.id) {
    <option [ngValue]="brand.id">{{ brand.brand }}</option>
    }
  </select>
  <button type="submit">Save</button>
</form>
